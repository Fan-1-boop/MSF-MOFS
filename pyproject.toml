[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "msf-mofs-repro"
version = "1.0.0"
description = "可复现的 MSF-MOFS 会议论文与卫星 V6 冻结部署代码"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scipy==1.17.0", "scikit-learn==1.8.0"]

[project.scripts]
msf-repro = "msf_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["msf_repro*", "irmofs*"]
